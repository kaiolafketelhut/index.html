AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  FAT77 and Asset Pipeline Serverless API Gateway

Globals:
  Function:
    Timeout: 5
    MemorySize: 128

Resources:
  PipelineApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.lambda_handler
      Runtime: python3.10
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /pipeline
            Method: get

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/pipeline/"
