name: FAT77 Build, Validate and SAM Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LDC (D programming language compiler)
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam-cli@v2

      - name: Verify MAIN.LIB and parse
        run: |
          rdmd parse_lib.d

      - name: Build Advanced FAT77 Image
        run: |
          rdmd FAT77.d
          ls -lh fat77.img

      - name: Run Pipeline and Lambda Unit Tests
        run: |
          python3 test_pipeline.py
          python3 test_lambda.py

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fat77-pipeline-report
          path: fat77_pipeline_report.pdf

      - name: Build SAM Application
        run: |
          sam build
